# SHV-E250K / Sxmo: Mali-400 cannot provide Chromium's required GL ES 3 context.
# musl 1.2.6 pwrite uses pwritev2, blocked by this ARM Chromium GPU sandbox.
# Avoid GPU shader-cache writes without disabling Chromium's sandbox.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-gpu --disable-gpu-shader-disk-cache"
